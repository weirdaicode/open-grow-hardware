; LogMyGrow desk display for the ESP32-2432S028R ("Cheap Yellow Display").
; Open THIS folder (devices/cyd) in VS Code with the PlatformIO extension and press Upload.
; All screen settings live here, so you never have to edit TFT_eSPI's User_Setup.h.

[platformio]
src_dir = LogMyGrowDisplay
default_envs = cyd

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; two app slots so updates can install over Wi-Fi (firmware is ~1.2 MB, each slot 1.9 MB)
board_build.partitions = min_spiffs.csv
; XPT2046 comes from GitHub as a zip (no Git needed): the registry copy is old and has no begin(SPIClass&)
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/heads/master.zip
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000

; If colours look inverted or the screen stays white, your board is the
; ST7789 variant (often the USB-C "2-USB" board). Use this env instead:
[env:cyd_st7789]
extends = env:cyd
build_flags =
  -DUSER_SETUP_LOADED=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
  -DLMG_ST7789=1
  -DST7789_DRIVER=1
  -DTFT_RGB_ORDER=TFT_BGR
  -DTFT_INVERSION_OFF=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
